[options]
; ---- Rutas de modulos ----
addons_path = odoo/addons, custom_addons, custom_addons/stock-logistics-barcode

; ---- Base de datos ----
db_host = localhost
db_port = 5432
db_user = odoo
db_password = odoo
; Limita la lista de bases de datos a las que empiezan por este prefijo
dbfilter = ^mi_base_stock$

; ---- Servidor ----
http_port = 8069
; Contrasena del gestor de bases de datos (crear/eliminar BDs desde la web)
admin_passwd = admin
; Oculta el gestor de bases de datos y el enlace "Manage Databases" del login
list_db = False

; ---- Desarrollo ----
; Recarga de assets y plantillas sin reiniciar
dev_mode = reload,qweb,xml
log_level = info

; Carpeta de archivos adjuntos / filestore
data_dir = .odoo_data
