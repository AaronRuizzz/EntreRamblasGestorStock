; Plantilla sin secretos para pruebas. La instalación usa un archivo privado indicado con -Config.
[options]
; ---- Rutas de modulos ----
addons_path = odoo/addons, custom_addons

; ---- Base de datos ----
; Plantilla SIN contraseña a proposito: las pruebas usan un cluster PostgreSQL
; aislado con autenticacion `trust` (test.ps1) y los datos reales viven en la
; configuracion privada que se pasa con -Config, nunca aqui. No pongas una
; contrasena real en este archivo: esta versionado.
db_host = localhost
db_port = 5432
db_user = odoo
; Limita la lista de bases de datos a las que empiezan por este prefijo
dbfilter = ^mi_base_stock$

; ---- Servidor ----
http_port = 8069
http_interface = 127.0.0.1
; Contrasena del gestor de bases de datos (crear/eliminar BDs desde la web)
; Oculta el gestor de bases de datos después de crear la base inicial
list_db = False

; ---- Desarrollo ----
; Recarga de assets y plantillas sin reiniciar
log_level = info

; Carpeta de archivos adjuntos / filestore
; Dentro vive tambien backups\, donde se deja el archivo con TODO el programa
; (ver custom_addons\mi_gestor_stock\models\mgs_backup.py).
data_dir = .odoo_data
